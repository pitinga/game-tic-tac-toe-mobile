name: Godot regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y godot4 || true
          if ! command -v godot4 >/dev/null; then
            wget -q https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip -O /tmp/godot.zip
            unzip -q /tmp/godot.zip -d /tmp
            sudo install /tmp/Godot_v4.5.2-stable_linux.x86_64 /usr/local/bin/godot4
          fi
      - name: Import assets
        run: godot4 --headless --path . --editor --quit
      - name: Test game rules
        run: godot4 --headless --path . --script res://tests/test_rules.gd
      - name: Test navigation and UI state
        run: godot4 --headless --path . --script res://tests/test_ui.gd
      - name: Smoke test main scene
        run: godot4 --headless --path . --quit-after 10
