name: Godot regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot4
          godot4 --version
      - name: Import assets
        run: timeout 120 godot4 --headless --path . --editor --quit
      - name: Test game rules
        run: timeout 120 godot4 --headless --path . --script res://tests/test_rules.gd
      - name: Test navigation and UI state
        run: timeout 120 godot4 --headless --path . --script res://tests/test_ui.gd
      - name: Smoke test main scene
        run: |
          set -o pipefail
          timeout 120 godot4 --headless --path . --quit-after 10 2>&1 | tee /tmp/godot-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" /tmp/godot-smoke.log; then exit 1; fi
